{% extends 'base.html' %}

{% block title %}Create Account - NihongoLearn{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
                <small style="color: #666; display: block; margin-top: 5px;">Must be at least 8 characters and contain a number.</small>
            </div>
            <button type="submit" class="btn btn-success" style="margin-top: 10px;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
            Already registered? <a href="{{ url_for('login_page') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
