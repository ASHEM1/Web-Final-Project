{% extends 'base.html' %}

{% block title %}Create Account - NihongoLearn{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px; text-align: center;">Create Account</h2>
        <form action="{{ url_for('register') }}" method="POST">
            
                <!-- E-mailadres -->
            <div class="form-group" style="margin-top: 15px;">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="example@domain.com" required>
            </div>

                <!-- Birthdate -->
            <div class="form-group" style="margin-top: 15px;">
                <label>Date of Birth</label>
                <input type="date" name="birthdate" class="form-control" required>
            </div>

                <!-- Japanese Niveau Dropdown -->
            <div class="form-group" style="margin-top: 15px;">
                <label>Current Japanese Level</label>
                <select name="japanese_level" class="form-control" required>
                    <option value="" disabled selected>Select your level...</option>
                    <option value="beginner">Beginner (Absolute Beginner / Kana)</option>
                    <option value="intermediate">Intermediate (JLPT N5 - N4)</option>
                    <option value="advanced">Advanced (JLPT N3+)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" id="username" class="form-control" autocomplete="off" required>
                <!-- Live indicator for availability -->
                <small id="username-feedback" style="display: block; margin-top: 5px; font-weight: bold;"></small>
            </div>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>Password</label>
                <input type="password" name="password" id="password" class="form-control" required>
                
                <!-- Live feedback list for password requirements -->
                <div style="margin-top: 8px; font-size: 0.85rem; line-height: 1.5;">
                    <div id="req-length" style="color: #dc3545;">❌ Must be at least 8 characters long</div>
                    <div id="req-number" style="color: #dc3545;">❌ Must contain a number</div>
                </div>

            </div>
            
            <!-- Submit button -->
            <button type="submit" id="submit-btn" class="btn btn-success" style="margin-top: 15px; width: 100%;" disabled>Register</button>
        </form>
        
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
            Already registered? <a href="{{ url_for('login_page') }}">Login here</a>
        </p>
    </div>
</div>

<script>
const usernameInput = document.getElementById('username');
const usernameFeedback = document.getElementById('username-feedback');
const passwordInput = document.getElementById('password');
const reqLength = document.getElementById('req-length');
const reqNumber = document.getElementById('req-number');
const submitBtn = document.getElementById('submit-btn');

// Check if the form is valid and enable/disable the submit button accordingly
let usernameValid = false;
let passwordLengthValid = false;
let passwordNumberValid = false;

// Function that checks if the submit button should be enabled or disabled
function validateForm() {
    if (usernameValid && passwordLengthValid && passwordNumberValid) {
        submitBtn.disabled = false;
    } else {
        submitBtn.disabled = true;
    }
}

//  LIVE USERNAME CHECK (AJAX to Flask)
usernameInput.addEventListener('input', function() {
    const username = usernameInput.value.trim();
    
    if (username.length === 0) {
        usernameFeedback.textContent = "";
        usernameValid = false;
        validateForm();
        return;
    }

    // Send AJAX request to check if username exists
    fetch("{{ url_for('check_username') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username })
    })
    .then(response => response.json())
    .then(data => {
        if (data.exists) {
            usernameFeedback.textContent = "❌ This username is already taken";
            usernameFeedback.style.color = "#dc3545";
            usernameValid = false;
        } else {
            usernameFeedback.textContent = "✅ Username is available!";
            usernameFeedback.style.color = "#28a745";
            usernameValid = true;
        }
        validateForm();
    })
    .catch(err => console.error("Error checking username:", err));
});

//  LIVE PASSWORD CHECK
passwordInput.addEventListener('input', function() {
    const value = passwordInput.value;

    // Check lengte
    if (value.length >= 8) {
        reqLength.textContent = "✅ Must be at least 8 characters long";
        reqLength.style.color = "#28a745";
        passwordLengthValid = true;
    } else {
        reqLength.textContent = "❌ Must be at least 8 characters long";
        reqLength.style.color = "#dc3545";
        passwordLengthValid = false;
    }

    // Check op cijfer
    if (/\d/.test(value)) {
        reqNumber.textContent = "✅ Must contain a number";
        reqNumber.style.color = "#28a745";
        passwordNumberValid = true;
    } else {
        reqNumber.textContent = "❌ Must contain a number";
        reqNumber.style.color = "#dc3545";
        passwordNumberValid = false;
    }

    validateForm();
});
</script>
{% endblock %}
