{% extends 'base.html' %}

{% block title %}Sign In - NihongoLearn{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <div class="card">
        <h2 style="margin-bottom: 20px; text-align: center;">Sign In</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
            Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
